# OpenSSF Scorecard supply-chain analysis for this fork. Results go to the
# code-scanning dashboard and, because the repository is public, to the
# OpenSSF REST API (publish_results), which enables the Scorecard badge.
name: Scorecard supply-chain security

on:
  # Branch-Protection check; only the default branch is supported.
  branch_protection_rule:
  # Keep the Maintained check fresh.
  schedule:
    - cron: '31 6 * * 0'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # publish_results only works from the default branch of this repository.
    if: github.repository == 'abnormalhq/stalwart' && github.event.repository.default_branch == github.ref_name
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      # Upload SARIF results to the code-scanning dashboard.
      security-events: write
      # Publish results to the OpenSSF REST API.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
