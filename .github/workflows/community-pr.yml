name: Community PR CI

on:
  pull_request:
    branches: [main, devin/1794818404-capability-foundation]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community:
    if: github.repository == 'abnormalhq/stalwart'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install libclang for RocksDB
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev

      - name: Check generated UI assets
        run: python3 scripts/generate-ui-assets.py --check

      - name: Check Community gates and compatibility
        run: python3 scripts/check-community.py

      - name: Run presentation and recipient-policy tests
        shell: bash
        run: |
          set -euo pipefail

          for filter in mail_presentation::tests recipient_policy::; do
            selected="$(cargo test --locked -p common --no-default-features "$filter" -- --list | awk '/: test$/ { count += 1 } END { print count + 0 }')"
            if [[ "$selected" -eq 0 ]]; then
              echo "No tests selected for filter: $filter" >&2
              exit 1
            fi
            echo "$filter: $selected tests selected"
          done

          cargo test --locked -p common --no-default-features mail_presentation::tests
          cargo test --locked -p common --no-default-features recipient_policy::

      - name: Check Community build
        run: cargo check --locked -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis keep azure nats"

      - name: Run Community route tests
        run: |
          cargo test --locked -p common --no-default-features community_
          cargo test --locked -p http@1.1.0 --no-default-features community_redirect_tests

      - name: Run image-size regression tests
        run: cargo test --locked -p spam-filter --no-default-features analysis::image_size::tests

      - name: Run HTML analyzer regression tests
        run: cargo test --locked -p spam-filter --no-default-features analysis::html::image_size_tests
