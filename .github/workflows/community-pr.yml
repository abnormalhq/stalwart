name: Community PR CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, devin/1794818404-capability-foundation]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  community:
    if: github.repository == 'abnormalhq/stalwart'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install libclang for RocksDB
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev

      - name: Run DAV RocksDB fence contract
        run: cargo test --locked -p dav --no-default-features --features test-rocks common::create::tests

      - name: Check generated UI assets
        run: python3 scripts/generate-ui-assets.py --check

      - name: Check Community gates and compatibility
        run: python3 scripts/check-community.py

      - name: Run presentation and recipient-policy tests
        shell: bash
        run: |
          set -euo pipefail

          for filter in mail_presentation::tests recipient_policy::; do
            selected="$(cargo test --locked -p common --no-default-features "$filter" -- --list | awk '/: test$/ { count += 1 } END { print count + 0 }')"
            if [[ "$selected" -eq 0 ]]; then
              echo "No tests selected for filter: $filter" >&2
              exit 1
            fi
            echo "$filter: $selected tests selected"
          done

          cargo test --locked -p common --no-default-features mail_presentation::tests
          cargo test --locked -p common --no-default-features recipient_policy::

      - name: Check Community build
        run: cargo check --locked -p stalwart --no-default-features --features "sqlite postgres mysql rocks s3 redis keep azure nats"

      - name: Run Community route tests
        run: |
          cargo test --locked -p common --no-default-features community_
          cargo test --locked -p common --no-default-features mail_capabilities::tests
          cargo test --locked -p common --no-default-features --features ai-spam-test-sqlite ai_spam::tests
          cargo test --locked -p common --no-default-features masked
          cargo test --locked -p common --no-default-features network::masked::tests
          cargo test --locked -p jmap --no-default-features registry::tests::masked_email_is_forbidden_while_regular_objects_remain_available
          cargo test --locked -p store --no-default-features atomic_builder_suppresses_splits_and_default_builder_still_splits
          cargo test --locked -p store --no-default-features --features sqlite masked_email_directory_record_persists_after_reopen
          cargo test --locked -p services --no-default-features community_account_cleanup_includes_masked_emails
          cargo test --locked -p groupware --no-default-features
          cargo test --locked -p email --no-default-features email_ingest_maps_submission_and_delivery_origins_for_calendar_mime
          cargo test --locked -p dav --no-default-features
          cargo test --locked -p imap --no-default-features core::view::community_append_tests
          cargo test --locked -p imap --no-default-features selected_mailbox_refreshes_exist_before_fetch_and_search_and_expunges
          cargo test --locked -p http@1.1.1 --no-default-features community_redirect_tests

      - name: Run message recovery tests
        run: 'cargo test --locked -p common --no-default-features --features recovery-test-sqlite message_recovery::'

      - name: Run AnyChunked raw-key tests
        run: cargo test --locked -p store --no-default-features any_chunked_tests

      - name: Run native Inbox restore slot test
        run: cargo test --locked -p email --no-default-features message_recovery_slot_tests::pending_restore_ids_accept_native_inbox_id

      - name: Run image-size regression tests
        run: cargo test --locked -p spam-filter --no-default-features analysis::image_size::tests

      - name: Run HTML analyzer regression tests
        run: cargo test --locked -p spam-filter --no-default-features analysis::html::image_size_tests

  dav-fence-postgres:
    if: github.repository == 'abnormalhq/stalwart'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: dav_fence_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dav_fence_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      STALWART_DAV_FENCE_POSTGRES: loopback
      STALWART_DAV_FENCE_POSTGRES_PORT: "5432"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Run DAV PostgreSQL fence contract
        run: cargo test --locked -p dav --no-default-features --features test-postgres common::create::tests

  recovery-foundationdb:
    if: github.repository == 'abnormalhq/stalwart'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install libclang for FoundationDB bindings
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libclang-dev

      - name: Run isolated FoundationDB recovery regression
        run: bash scripts/test-recovery-foundationdb.sh
