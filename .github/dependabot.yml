version: 2

updates:
  # Actions used by the workflows in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    # Open a PR only a few days after a new version is released, to avoid versions that are withdrawn or poisoned right after release.
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # The Rust workspace (single Cargo.lock at the root).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    # minor / patch updates land in one PR; majors get their own PR so breaking changes can be reviewed one by one.
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Base images of the Dockerfiles at the repository root.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
